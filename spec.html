<!DOCTYPE html>

<head>

<title>ガリ勉 スペック表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}

main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;max-width:560px;width:100%;margin:0 auto;align-content:start;padding-top:12px}
.c{background:#fff;border:1px solid #d3d8d6;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;min-height:56px}
.c b{color:#b8641f;font-size:1.2rem;line-height:1.15}

.c span{font-size:.72rem;color:#455a64;line-height:1.25}
</style>
</head>
<body>

<main><div class="c"><b>51,718<small>字</small></b><span>漢字</span></div><div class="c"><b>24,960<small>字</small></b><span>手書きで出せる漢字</span></div><div class="c"><b>6,712<small>字</small></b><span>書き順</span></div><div class="c"><b>41,017<small>字</small></b><span>意味</span></div><div class="c"><b>317<small>組</small></b><span>旧字・異体字の対応</span></div><div class="c"><b>6,516<small>形</small></b><span>名前・保険証の形</span></div><div class="c"><b>180,892<small>語</small></b><span>言葉</span></div><div class="c"><b>125,096<small>語</small></b><span>地名・駅名</span></div><div class="c"><b>95,732<small>件</small></b><span>町名</span></div><div class="c"><b>18,561<small>語</small></b><span>医学・専門用語</span></div><div class="c"><b>45,366<small>語</small></b><span>英和・和英</span></div><div class="c"><b>374<small></small></b><span>ことわざ</span></div><div class="c"><b>254<small></small></b><span>四字熟語</span></div><div class="c"><b>108<small>種</small></b><span>魚へん</span></div></main>
</body>
